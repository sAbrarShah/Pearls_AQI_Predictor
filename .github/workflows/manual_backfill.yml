name: Manual Backfill

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many days to backfill"
        required: true
        default: "180"
      chunk_days:
        description: "Chunk size in days"
        required: true
        default: "14"
      sleep_sec:
        description: "Sleep between chunks (seconds)"
        required: true
        default: "0.25"

concurrency:
  group: aqi-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"

      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      MONGO_RAW_COLLECTION: ${{ secrets.MONGO_RAW_COLLECTION }}
      MONGO_CLEAN_COLLECTION: ${{ secrets.MONGO_CLEAN_COLLECTION }}

      HTTP_TIMEOUT_SEC: ${{ secrets.HTTP_TIMEOUT_SEC }}
      HTTP_RETRIES: ${{ secrets.HTTP_RETRIES }}
      HTTP_BACKOFF_SEC: ${{ secrets.HTTP_BACKOFF_SEC }}

      BACKFILL_DAYS: ${{ inputs.backfill_days }}
      BACKFILL_CHUNK_DAYS: ${{ inputs.chunk_days }}
      BACKFILL_SLEEP_SEC: ${{ inputs.sleep_sec }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill
        run: python scripts/backfill.py